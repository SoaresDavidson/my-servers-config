services:
  tailscale-radarr:
    image: tailscale/tailscale:latest
    container_name: radarr_tailscale
    hostname: radarr
    ports:
      - "7878:7878"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    networks:
      - media-network

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: service:tailscale-radarr
    depends_on:
      - tailscale-radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_HOST_PATH}/radarr/config:/config
      - ${DOWNLOADS_HOST_PATH}:/downloads
      - ${MEDIA_HOST_PATH}/movies:/movies
    restart: unless-stopped

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true

volumes:
  tailscale-state:

x-casaos:
  main: tailscale-radarr
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: linuxserver.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/radarr.png
  scheme: http
  port_map: "7878"
  index: /
  title:
    custom: Radarr
  tagline:
    custom: Radarr atras de Tailscale
  description:
    custom: Radarr exposto pela sidecar Tailscale, na rede Docker compartilhada.
