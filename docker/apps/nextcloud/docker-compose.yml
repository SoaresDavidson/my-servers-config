services:
  tailscale-nextcloud:
    image: tailscale/tailscale:latest
    container_name: nextcloud_tailscale
    hostname: nextcloud
    ports:
      - "7580:80"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=nextcloud
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/nextcloud:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep tailscaled"]
      interval: 2m
      timeout: 5s
      retries: 3
    networks:
      - media-network

  # Postgres e Redis dividem o namespace da sidecar e escutam só em 127.0.0.1: nem a rede
  # Docker nem o tailnet alcançam o banco.
  db:
    # Major fixo: o diretório de dados é do Postgres 14 e não sobe em outro major sem pg_upgrade.
    image: postgres:14
    container_name: nextcloud_db
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    labels:
      - autoheal=true
      - docker-volume-backup.stop-during-backup=true
    network_mode: service:tailscale-nextcloud
    depends_on:
      tailscale-nextcloud:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Só valem num diretório vazio.
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD:?defina NEXTCLOUD_DB_PASSWORD no .env}
    volumes:
      - ${CONFIG_HOST_PATH}/nextcloud/db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -e /sys/class/net/eth0 && pg_isready -h 127.0.0.1"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 5s

  redis:
    # Só cache e locks; nada a persistir.
    image: redis:7-alpine
    container_name: nextcloud_redis
    command: ["redis-server", "--bind", "127.0.0.1", "--save", "", "--appendonly", "no"]
    labels:
      - autoheal=true
    network_mode: service:tailscale-nextcloud
    depends_on:
      tailscale-nextcloud:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -e /sys/class/net/eth0 && redis-cli -h 127.0.0.1 ping | grep -q PONG"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 5s

  nextcloud:
    # Major fixo: o Nextcloud não pula majors, e o update-all puxaria um latest dois majors à frente.
    image: nextcloud:33-apache
    container_name: nextcloud
    labels:
      - autoheal=true
      - docker-volume-backup.stop-during-backup=true
    network_mode: service:tailscale-nextcloud
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # Instalação automática; só vale com /var/www/html vazio.
      - POSTGRES_HOST=127.0.0.1
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:?defina NEXTCLOUD_ADMIN_USER no .env}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:?defina NEXTCLOUD_ADMIN_PASSWORD no .env}
      - PHP_MEMORY_LIMIT=1024M
      - PHP_UPLOAD_LIMIT=1024M
      # Lidos a cada request pelos config/*.config.php da imagem, por cima do config.php.
      - REDIS_HOST=127.0.0.1
      - TRUSTED_PROXIES=127.0.0.1
      # O tailscale serve chega de 127.0.0.1 com TLS já terminado. Só nesse caso força https e o
      # host do tailnet; LAN (porta 7580) e o OnlyOffice pela rede Docker seguem em http.
      - OVERWRITECONDADDR=^127\.0\.0\.1$$
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=nextcloud.${TS_DOMAIN}
      - OVERWRITECLIURL=https://nextcloud.${TS_DOMAIN}
      # Usados pelo hook before-starting.
      - TS_DOMAIN=${TS_DOMAIN}
      - HOST_LAN_IP=${HOST_LAN_IP}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:?defina ONLYOFFICE_JWT_SECRET no .env}
    volumes:
      - ${CONFIG_HOST_PATH}/nextcloud/html:/var/www/html
      - ./hooks/post-installation:/docker-entrypoint-hooks.d/post-installation:ro
      - ./hooks/before-starting:/docker-entrypoint-hooks.d/before-starting:ro
      # External Storage "Mídia". Só leitura: a biblioteca é dos *arr (hardlinks e seeding).
      - ${DATA_HOST_PATH}:/mnt/midia:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -e /sys/class/net/eth0 && curl -fs http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 5m
      start_interval: 10s

  cron:
    image: nextcloud:33-apache
    container_name: nextcloud_cron
    entrypoint: /cron.sh
    labels:
      - autoheal=true
      - docker-volume-backup.stop-during-backup=true
    network_mode: service:tailscale-nextcloud
    depends_on:
      nextcloud:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - REDIS_HOST=127.0.0.1
    volumes:
      - ${CONFIG_HOST_PATH}/nextcloud/html:/var/www/html
      # Os background jobs também varrem o External Storage.
      - ${DATA_HOST_PATH}:/mnt/midia:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -e /sys/class/net/eth0"]
      interval: 2m
      timeout: 5s
      retries: 3

  tailscale-onlyoffice:
    image: tailscale/tailscale:latest
    container_name: onlyoffice_tailscale
    hostname: onlyoffice
    # Editor de documentos do Nextcloud, com sidecar Tailscale própria (onlyoffice.<tailnet>.ts.net).
    # Sem porta no host: o navegador abre o editor em https://onlyoffice.<tailnet>.ts.net e o
    # Nextcloud fala com http://tailscale-onlyoffice pela rede Docker.
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/onlyoffice:/var/lib/tailscale
      - ./onlyoffice-ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep tailscaled"]
      interval: 2m
      timeout: 5s
      retries: 3
    networks:
      - media-network

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    labels:
      - autoheal=true
      - docker-volume-backup.stop-during-backup=true
    network_mode: service:tailscale-onlyoffice
    depends_on:
      tailscale-onlyoffice:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      # O mesmo segredo vai para o app onlyoffice do Nextcloud (hook before-starting).
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:?defina ONLYOFFICE_JWT_SECRET no .env}
      # O Nextcloud é alcançado por http://tailscale-nextcloud, um IP da rede Docker; sem isto o
      # Document Server recusa baixar e salvar os arquivos.
      - ALLOW_PRIVATE_IP_ADDRESS=true
    volumes:
      # Postgres, RabbitMQ e Redis embutidos: só estado das sessões de edição e cache.
      - ${CONFIG_HOST_PATH}/onlyoffice/lib:/var/lib/onlyoffice
      - ${CONFIG_HOST_PATH}/onlyoffice/db:/var/lib/postgresql
      - ${CONFIG_HOST_PATH}/onlyoffice/rabbitmq:/var/lib/rabbitmq
      - ${CONFIG_HOST_PATH}/onlyoffice/redis:/var/lib/redis
      - ${CONFIG_HOST_PATH}/onlyoffice/data:/var/www/onlyoffice/Data
      - ${CONFIG_HOST_PATH}/onlyoffice/logs:/var/log/onlyoffice
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -e /sys/class/net/eth0 && curl -fs http://localhost/healthcheck | grep -q true"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 5m
      start_interval: 10s

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true
