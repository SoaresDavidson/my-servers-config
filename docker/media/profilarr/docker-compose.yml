services:
  tailscale-profilarr:
    image: tailscale/tailscale:latest
    container_name: profilarr_tailscale
    hostname: profilarr
    ports:
      - "6868:6868"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/profilarr:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: on-failure:5
    networks:
      - media-network

  # Profilarr v2 (dictionarry-hub). O /config do v1 (santiagosayshey) não é compatível:
  # o v2 usa um diretório próprio e o v1 fica intacto em profilarr/config como backup.
  profilarr:
    image: ghcr.io/dictionarry-hub/profilarr:latest
    container_name: profilarr
    labels:
      - autoheal=true
      - docker-volume-backup.stop-during-backup=true
    network_mode: service:tailscale-profilarr
    depends_on:
      tailscale-profilarr:
        condition: service_started
      profilarr-parser:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=022
      - TZ=${TZ}
      # Resolvido pelo DNS da rede compartilhada (o netns é o do sidecar tailscale).
      - PARSER_HOST=profilarr-parser
      - PARSER_PORT=5000
      # O tailscale serve termina o HTTPS e repassa em HTTP: sem isso o login pelo
      # endereço do tailnet cai no CSRF (origin https != esperado http). Aceita uma URL só
      # (lista com vírgula não funciona na 2.3.1), então o login pela LAN (:6868) fica bloqueado.
      - ORIGIN=https://profilarr.${TS_DOMAIN}
    volumes:
      - ${CONFIG_HOST_PATH}/profilarr/v2:/config
    restart: on-failure:5
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:6868/api/v1/health"]
      interval: 2m
      timeout: 10s
      start_period: 30s
      retries: 3

  # Parser de nomes de release (.NET). Opcional: só é usado para testar CFs e perfis na UI.
  # A imagem já traz HEALTHCHECK em /health.
  profilarr-parser:
    image: ghcr.io/dictionarry-hub/profilarr-parser:latest
    container_name: profilarr-parser
    labels:
      - autoheal=true
    expose:
      - "5000"
    restart: on-failure:5
    networks:
      - media-network

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true
