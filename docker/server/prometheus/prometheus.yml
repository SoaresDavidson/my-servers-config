global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      # host-lan é o HOST_LAN_IP, via extra_hosts no docker-compose.yml.
      - targets: ["host-lan:9100"]
        labels:
          instance: macbook

  - job_name: cadvisor
    # Igual ao --housekeeping_interval do cAdvisor: coletar mais rápido só repetiria valores.
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          instance: macbook

  - job_name: falaai
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["falaai_tailscale:8000"]
