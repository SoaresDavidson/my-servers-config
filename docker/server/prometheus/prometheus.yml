global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      # host-lan é o HOST_LAN_IP, via extra_hosts no docker-compose.yml.
      - targets: ["host-lan:9100"]
        labels:
          instance: macbook
