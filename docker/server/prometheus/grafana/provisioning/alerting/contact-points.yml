apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord
    receivers:
      - uid: discord
        type: discord
        settings:
          # Vem do .env pelo docker-compose.yml; o Grafana expande ${VAR} nos arquivos de provisionamento.
          url: ${DISCORD_WEBHOOK_URL}
          use_discord_username: false

policies:
  - orgId: 1
    receiver: discord
    group_by: ["grafana_folder", "alertname"]
    # Espera antes do primeiro aviso de um grupo, para juntar alertas que disparam juntos.
    group_wait: 30s
    group_interval: 5m
    # Repete o aviso enquanto o problema continuar.
    repeat_interval: 4h
