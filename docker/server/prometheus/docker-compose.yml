services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: "${PUID:?Defina PUID}:${PGID:?Defina PGID}"
    labels:
      - autoheal=true
      - docker-volume-backup.stop-during-backup=true
    ports:
      # 9090 já é usada pelo dispositivo sem fio do Calibre.
      - "${HOST_LAN_IP:?Defina HOST_LAN_IP para publicar somente na LAN}:9091:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${CONFIG_HOST_PATH:?Defina CONFIG_HOST_PATH}/prometheus:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    extra_hosts:
      # O node-exporter roda na rede do host; o prometheus.yml não expande variáveis,
      # então o IP da LAN entra aqui como um nome fixo.
      - "host-lan:${HOST_LAN_IP}"
    networks:
      - media-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    labels:
      - autoheal=true
    # Rede e PID do host: métricas da ens9 e dos processos reais, não as do container.
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=${HOST_LAN_IP:?Defina HOST_LAN_IP}:9100
      - --collector.systemd
      - --collector.systemd.unit-include=(mac-.+|mbpfan|powertop|hd-idle|docker|tailscaled|hermes-gateway-.+)\.service
    volumes:
      # rslave: discos montados depois da subida (HD de mídia) também aparecem.
      - /:/host:ro,rslave
      - /run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://${HOST_LAN_IP}:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Métricas por container (CPU, memória, rede, I/O). Sem porta publicada: o Prometheus
  # lê pela rede Docker. Ajustado para gastar pouca CPU, que é o recurso escasso do MacBook.
  cadvisor:
    image: ghcr.io/google/cadvisor:latest
    container_name: cadvisor
    labels:
      - autoheal=true
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      # Sem rótulos do compose nas métricas: o nome do container (label "name") basta,
      # e cada rótulo a mais multiplica as séries guardadas.
      - --store_container_labels=false
      # "disk" mede o espaço de cada camada com du, o mais caro de todos. I/O (diskIO) continua.
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
      # Nomes e cgroups dos containers. As versões novas leem pelos dois sockets; sem o do
      # containerd, a fábrica docker não registra e nada é coletado. Os sockets dão acesso
      # total ao Docker, mesmo montados :ro.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - media-network

  # Logs dos containers, guardados para consulta no Grafana. Sem porta publicada: o Alloy
  # envia e o Grafana consulta pela rede Docker.
  loki:
    image: grafana/loki:latest
    container_name: loki
    user: "${PUID:?Defina PUID}:${PGID:?Defina PGID}"
    labels:
      - docker-volume-backup.stop-during-backup=true
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - ${CONFIG_HOST_PATH:?Defina CONFIG_HOST_PATH}/loki:/loki
    restart: unless-stopped
    # Sem healthcheck: a imagem é distroless, sem shell nem wget.
    networks:
      - media-network

  # Coletor: lê o log de cada container pelo socket do Docker e envia ao Loki.
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    labels:
      - autoheal=true
    depends_on:
      - loki
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      # Posição de leitura de cada container: sem ela, cada recriação reenviaria o log todo.
      - ${CONFIG_HOST_PATH:?Defina CONFIG_HOST_PATH}/alloy:/var/lib/alloy/data
      # Acesso total ao Docker, mesmo montado :ro.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    healthcheck:
      # A imagem não tem wget nem curl; o bash fala HTTP com a interface local do Alloy.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - media-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "${PUID:?Defina PUID}:${PGID:?Defina PGID}"
    labels:
      - autoheal=true
      - docker-volume-backup.stop-during-backup=true
    depends_on:
      - prometheus
      - loki
      - grafana-renderer
    ports:
      # 3000 já é usada pelo homepage.
      - "${HOST_LAN_IP:?Defina HOST_LAN_IP}:3001:3000"
    environment:
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Defina GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      # Lido pelo provisioning/alerting/contact-points.yml.
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:?Defina DISCORD_WEBHOOK_URL}
      # PNG de painéis via serviço externo; o callback é como o renderer volta ao Grafana pela rede interna.
      - GF_RENDERING_SERVER_URL=http://grafana-renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      # O Grafana recusa iniciar com o token padrão "-"; tem que ser igual ao AUTH_TOKEN do renderer.
      - GF_RENDERING_RENDERER_TOKEN=${GRAFANA_RENDERER_TOKEN:?Defina GRAFANA_RENDERER_TOKEN}
    volumes:
      # Datasources do Prometheus e do Loki versionados; dashboards e usuários ficam no banco em /var/lib/grafana.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ${CONFIG_HOST_PATH:?Defina CONFIG_HOST_PATH}/grafana:/var/lib/grafana
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - media-network

  # Chromium headless que gera os PNGs para o Grafana; sem porta publicada, só a rede interna o acessa.
  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: grafana-renderer
    environment:
      - AUTH_TOKEN=${GRAFANA_RENDERER_TOKEN:?Defina GRAFANA_RENDERER_TOKEN}
    restart: unless-stopped
    networks:
      - media-network

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true
