services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=${TZ}
      # Nao baixa imagens/CSS/fontes: host antigo, cada pagina custa menos pro Chromium.
      - DISABLE_MEDIA=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8191/ || exit 1"]
      interval: 2m
      timeout: 10s
      retries: 3
    networks:
      - media-network

  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest
    container_name: decluttarr
    # Configurado todo por env (decluttarr v2). As chaves reaproveitam as HOMEPAGE_VAR_*
    # do .env (scripts/homepage-keys.sh). Os *arr ficam atras da sidecar Tailscale, entao
    # o host na rede Docker e o container_name da sidecar.
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      # Minutos entre execucoes.
      TIMER: 15
      # Desmarca no qBittorrent o que não é mídia (.exe, .lnk, .rar...) e põe o release na blocklist.
      REMOVE_BAD_FILES: True
      REMOVE_FAILED_DOWNLOADS: True
      # Sem message_patterns: vale para toda recusa de import, inclusive "Found executable file".
      REMOVE_FAILED_IMPORTS: True
      REMOVE_METADATA_MISSING: True
      REMOVE_MISSING_FILES: True
      REMOVE_ORPHANS: True
      REMOVE_SLOW: True
      REMOVE_STALLED: True
      REMOVE_UNMONITORED: True
      SONARR: >
        [{"base_url": "http://sonarr_tailscale:8989", "api_key": "${HOMEPAGE_VAR_SONARR_KEY}"}]
      RADARR: >
        [{"base_url": "http://radarr_tailscale:7878", "api_key": "${HOMEPAGE_VAR_RADARR_KEY}"}]
      LIDARR: >
        [{"base_url": "http://lidarr_tailscale:8686", "api_key": "${HOMEPAGE_VAR_LIDARR_KEY}"}]
      # Bookshelf e um fork do Readarr, mesma API.
      READARR: >
        [{"base_url": "http://bookshelf_tailscale:8787", "api_key": "${HOMEPAGE_VAR_BOOKSHELF_KEY}"}]
      QBITTORRENT: >
        [{"base_url": "http://qbittorrent:8080", "username": "${QBITTORRENT_USERNAME}", "password": "${QBITTORRENT_PASSWORD}"}]
    volumes:
      # Mesmo /data dos *arr, so leitura, para o job detect_deletions enxergar a biblioteca.
      - ${DATA_HOST_PATH}:/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f decluttarr || exit 1"]
      interval: 2m
      timeout: 10s
      retries: 3
    networks:
      - media-network

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    # Reinicia containers com label autoheal=true que ficarem unhealthy. Caso principal: app com
    # network_mode service:<sidecar> que perdeu a rede porque a sidecar Tailscale reiniciou depois
    # dele (ex.: boot lento) e o deixou num network namespace orfao, so com lo. O healthcheck dos
    # apps testa /sys/class/net/eth0 para detectar isso.
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 120
      # Folga para o boot: nao age nos primeiros minutos, enquanto as sidecars ainda sobem.
      AUTOHEAL_START_PERIOD: 300
      TZ: ${TZ}
    volumes:
      # Precisa da API de restart (o :ro so impede trocar o arquivo do socket, nao limita a API).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    network_mode: none

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true

x-casaos:
  main: flaresolverr
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: flaresolverr
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/flaresolverr.png
  scheme: http
  port_map: "8191"
  index: /
  title:
    custom: Media Helpers
  tagline:
    custom: FlareSolverr e Decluttarr
  description:
    custom: Servicos auxiliares do stack arr, sem Tailscale, apenas na rede interna.
