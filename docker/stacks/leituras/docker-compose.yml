services:
  tailscale-leituras:
    image: tailscale/tailscale:latest
    container_name: leituras_tailscale
    hostname: leituras
    ports:
      # So no IP da LAN: o Kindle envia para http://<HOST_LAN_IP>:3333 e o /api/plugin/import nao tem auth.
      - "${HOST_LAN_IP}:3333:3333"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/leituras:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep tailscaled"]
      interval: 2m
      timeout: 5s
      retries: 3
    networks:
      - media-network

  leituras:
    # Sem imagem publicada: o compose builda direto do GitHub (repo publico).
    # Para pegar commits novos da main: docker compose up -d --build leituras
    build: https://github.com/SoaresDavidson/leituras.git#main
    image: leituras:local
    # "always" faria o compose tentar puxar leituras:local do Docker Hub (nao existe).
    # "build" rebuilda a cada `up`, pegando commits novos da main (cache de camadas evita rebuild total).
    pull_policy: build
    container_name: leituras
    labels:
      - autoheal=true
      - docker-volume-backup.stop-during-backup=true
    network_mode: service:tailscale-leituras
    depends_on:
      tailscale-leituras:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - TZ_NAME=${TZ}
    volumes:
      - ${CONFIG_HOST_PATH}/leituras:/data
    restart: unless-stopped
    healthcheck:
      # Imagem node:bookworm-slim: sem curl nem wget.
      test: ["CMD-SHELL", "test -e /sys/class/net/eth0 && node -e \"fetch('http://127.0.0.1:3333/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
      interval: 2m
      timeout: 10s
      retries: 3

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true


x-casaos:
  main: tailscale-leituras
  architectures:
    - amd64
  author: SoaresDavidson
  developer: SoaresDavidson
  category: Media
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/koreader.png
  scheme: http
  port_map: "3333"
  index: /
  title:
    custom: Leituras
  tagline:
    custom: Leituras atras de Tailscale
  description:
    custom: Dashboard de estatisticas de leitura do KOReader (fork do KoInsight), exposto pela sidecar Tailscale na rede Docker compartilhada.
