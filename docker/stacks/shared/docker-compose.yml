services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=${TZ}
      # Nao baixa imagens/CSS/fontes: host antigo, cada pagina custa menos pro Chromium.
      - DISABLE_MEDIA=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8191/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - media-network

  decluttarr:
    image: ghcr.io/manimatter/decluttarr:latest
    container_name: decluttarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DECLUTTARR_CRON=*/15 * * * *
      # Chaves de API dos *arr precisam ser adicionadas manualmente depois do setup.
    volumes:
      - ${CONFIG_HOST_PATH}/decluttarr/config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f decluttarr || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - media-network

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true

x-casaos:
  main: flaresolverr
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: flaresolverr
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/flaresolverr.png
  scheme: http
  port_map: "8191"
  index: /
  title:
    custom: Media Helpers
  tagline:
    custom: FlareSolverr e Decluttarr
  description:
    custom: Servicos auxiliares do stack arr, sem Tailscale, apenas na rede interna.
