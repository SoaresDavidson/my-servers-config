services:
  tailscale-questarr:
    image: tailscale/tailscale:latest
    container_name: questarr_tailscale
    hostname: questarr
    ports:
      - "5000:5000"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/questarr:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    networks:
      - media-network

  questarr:
    image: ghcr.io/doezer/questarr:latest
    container_name: questarr
    network_mode: service:tailscale-questarr
    depends_on:
      - tailscale-questarr
    environment:
      - SQLITE_DB_PATH=/app/data/sqlite.db
    volumes:
      - ${CONFIG_HOST_PATH}/questarr/data:/app/data
    restart: unless-stopped

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true

x-casaos:
  main: tailscale-questarr
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: doezer
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/questarr.png
  scheme: http
  port_map: "5000"
  index: /
  title:
    custom: Questarr
  tagline:
    custom: Questarr atras de Tailscale
  description:
    custom: Questarr exposto pela sidecar Tailscale, na rede Docker compartilhada.
