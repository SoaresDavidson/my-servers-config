services:
  tailscale-lidarr:
    image: tailscale/tailscale:latest
    container_name: lidarr_tailscale
    hostname: lidarr
    ports:
      - "8686:8686"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    networks:
      - media-network

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    network_mode: service:tailscale-lidarr
    depends_on:
      - tailscale-lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_HOST_PATH}/lidarr/config:/config
      - ${DOWNLOADS_HOST_PATH}:/downloads
      - ${MEDIA_HOST_PATH}/music:/music
    restart: unless-stopped

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true

volumes:
  tailscale-state:

x-casaos:
  main: tailscale-lidarr
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: linuxserver.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/lidarr.png
  scheme: http
  port_map: "8686"
  index: /
  title:
    custom: Lidarr
  tagline:
    custom: Lidarr atras de Tailscale
  description:
    custom: Lidarr exposto pela sidecar Tailscale, na rede Docker compartilhada.
