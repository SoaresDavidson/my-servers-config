services:
  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:latest
    container_name: qbittorrent
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # WireGuard da Proton VPN. wg0.conf fica em ${CONFIG_HOST_PATH}/qbittorrent/config/wireguard/wg0.conf
      - VPN_ENABLED=true
      - VPN_CONF=wg0
      - VPN_PROVIDER=proton
      # Libera a bridge do Docker no killswitch, para os outros containers alcancarem a WebUI e a API.
      - VPN_LAN_NETWORK=172.16.0.0/12
      - VPN_EXPOSE_PORTS_ON_LAN=8080
      - VPN_AUTO_PORT_FORWARD=true
      - VPN_HEALTHCHECK_ENABLED=true
      - PRIVOXY_ENABLED=false
    volumes:
      - ${CONFIG_HOST_PATH}/qbittorrent/config:/config
      - ${DOWNLOADS_HOST_PATH}:/downloads
    restart: unless-stopped
    networks:
      media-network:
        aliases:
          - qbittorrent

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true

x-casaos:
  main: qbittorrent
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: hotio
  category: Downloader
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/qbittorrent.png
  title:
    custom: qBittorrent
  tagline:
    custom: qBittorrent atras da Proton VPN
  description:
    custom: qBittorrent com WireGuard da Proton VPN. Sem porta publicada no host, acessivel apenas pelos outros containers da rede compartilhada.
