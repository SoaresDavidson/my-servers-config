services:
  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:latest
    container_name: qbittorrent
    ports:
      - "8080:8080"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # WireGuard da Proton VPN. wg0.conf fica em ${CONFIG_HOST_PATH}/qbittorrent/config/wireguard/wg0.conf
      - VPN_ENABLED=true
      - VPN_CONF=wg0
      - VPN_PROVIDER=proton
      # LAN fisica do host, para a WebUI responder a maquinas fora do servidor.
      - VPN_LAN_NETWORK=192.168.100.0/24
      - VPN_EXPOSE_PORTS_ON_LAN=8080/tcp
      - VPN_AUTO_PORT_FORWARD=true
      - VPN_HEALTHCHECK_ENABLED=true
      - PRIVOXY_ENABLED=false
    volumes:
      - ${CONFIG_HOST_PATH}/qbittorrent/config:/config
      - ${DATA_HOST_PATH}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      media-network:
        aliases:
          - qbittorrent

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true

x-casaos:
  main: qbittorrent
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: hotio
  category: Downloader
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/qbittorrent.png
  title:
    custom: qBittorrent
  tagline:
    custom: qBittorrent atras da Proton VPN
  description:
    custom: qBittorrent com WireGuard da Proton VPN. WebUI publicada na porta 8080 do host.
