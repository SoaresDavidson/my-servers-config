services:
  tailscale-qbittorrent:
    image: tailscale/tailscale:latest
    container_name: qbittorrent_tailscale
    hostname: qbittorrent
    ports:
      - "8081:8080"
      - "6881:6881/tcp"
      - "6881:6881/udp"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    networks:
      - media-network

  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:tailscale-qbittorrent
    depends_on:
      - tailscale-qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_HOST_PATH}/qbittorrent/config:/config
      - ${DOWNLOADS_HOST_PATH}:/downloads
    restart: unless-stopped

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true

volumes:
  tailscale-state:

x-casaos:
  main: tailscale-qbittorrent
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: hotio
  category: Downloader
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/qbittorrent.png
  scheme: http
  port_map: "8081"
  index: /
  title:
    custom: qBittorrent
  tagline:
    custom: qBittorrent atras de Tailscale
  description:
    custom: qBittorrent exposto pela sidecar Tailscale, na rede Docker compartilhada.
