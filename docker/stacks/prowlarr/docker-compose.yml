services:
  tailscale-prowlarr:
    image: tailscale/tailscale:latest
    container_name: prowlarr_tailscale
    hostname: prowlarr
    ports:
      - "9696:9696"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    networks:
      - media-network

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: service:tailscale-prowlarr
    depends_on:
      - tailscale-prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_HOST_PATH}/prowlarr/config:/config
    restart: unless-stopped

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true

volumes:
  tailscale-state:

x-casaos:
  main: tailscale-prowlarr
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: linuxserver.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/prowlarr.png
  scheme: http
  port_map: "9696"
  index: /
  title:
    custom: Prowlarr
  tagline:
    custom: Prowlarr atras de Tailscale
  description:
    custom: Prowlarr exposto pela sidecar Tailscale, na rede Docker compartilhada.
