services:
  tailscale-jellyseerr:
    image: tailscale/tailscale:latest
    container_name: jellyseerr_tailscale
    hostname: jellyseerr
    ports:
      - "5055:5055"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/jellyseerr:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep tailscaled"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - media-network

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    labels:
      - docker-volume-backup.stop-during-backup=true
    network_mode: service:tailscale-jellyseerr
    depends_on:
      tailscale-jellyseerr:
        condition: service_healthy
    init: true
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - PORT=5055
    volumes:
      - ${CONFIG_HOST_PATH}/jellyseerr/config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true


x-casaos:
  main: tailscale-jellyseerr
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: seerr-team
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jellyseerr.png
  scheme: http
  port_map: "5055"
  index: /
  title:
    custom: Jellyseerr
  tagline:
    custom: Jellyseerr atras de Tailscale
  description:
    custom: Jellyseerr exposto pela sidecar Tailscale, na rede Docker compartilhada.
