services:
  tailscale-lazylibrarian:
    image: tailscale/tailscale:latest
    container_name: lazylibrarian_tailscale
    hostname: lazylibrarian
    ports:
      - "5299:5299"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/lazylibrarian:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep tailscaled"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - media-network

  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    labels:
      - autoheal=true
      - docker-volume-backup.stop-during-backup=true
    network_mode: service:tailscale-lazylibrarian
    depends_on:
      tailscale-lazylibrarian:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_HOST_PATH}/lazylibrarian/config:/config
      # Mount unico, como nos *arr, para o pos-processamento poder fazer hardlink do download.
      - ${DATA_HOST_PATH}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -e /sys/class/net/eth0 && curl -fs -o /dev/null http://localhost:5299/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true


x-casaos:
  main: tailscale-lazylibrarian
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: linuxserver.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/lazylibrarian.png
  scheme: http
  port_map: "5299"
  index: /
  title:
    custom: LazyLibrarian
  tagline:
    custom: LazyLibrarian atras de Tailscale
  description:
    custom: LazyLibrarian exposto pela sidecar Tailscale, na rede Docker compartilhada.
