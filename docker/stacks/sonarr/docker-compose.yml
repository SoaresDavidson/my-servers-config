services:
  tailscale-sonarr:
    image: tailscale/tailscale:latest
    container_name: sonarr_tailscale
    hostname: sonarr
    ports:
      - "8989:8989"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    networks:
      - media-network

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: service:tailscale-sonarr
    depends_on:
      - tailscale-sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_HOST_PATH}/sonarr/config:/config
      - ${DOWNLOADS_HOST_PATH}:/downloads
      - ${MEDIA_HOST_PATH}/tv:/tv
    restart: unless-stopped

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true

volumes:
  tailscale-state:

x-casaos:
  main: tailscale-sonarr
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: linuxserver.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/sonarr.png
  scheme: http
  port_map: "8989"
  index: /
  title:
    custom: Sonarr
  tagline:
    custom: Sonarr atras de Tailscale
  description:
    custom: Sonarr exposto pela sidecar Tailscale, na rede Docker compartilhada.
