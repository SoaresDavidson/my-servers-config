services:
  tailscale-sonarr:
    image: tailscale/tailscale:latest
    container_name: sonarr_tailscale
    hostname: sonarr
    ports:
      - "8989:8989"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/sonarr:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep tailscaled"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - media-network

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    labels:
      - docker-volume-backup.stop-during-backup=true
    network_mode: service:tailscale-sonarr
    depends_on:
      tailscale-sonarr:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_HOST_PATH}/sonarr/config:/config
      - ${DATA_HOST_PATH}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true


x-casaos:
  main: tailscale-sonarr
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: linuxserver.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/sonarr.png
  scheme: http
  port_map: "8989"
  index: /
  title:
    custom: Sonarr
  tagline:
    custom: Sonarr atras de Tailscale
  description:
    custom: Sonarr exposto pela sidecar Tailscale, na rede Docker compartilhada.
