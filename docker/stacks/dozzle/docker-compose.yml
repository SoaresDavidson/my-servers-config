services:
  tailscale-dozzle:
    image: tailscale/tailscale:latest
    container_name: dozzle_tailscale
    hostname: dozzle
    ports:
      - "8888:8080"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/dozzle:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep tailscaled"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - media-network

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    labels:
      - autoheal=true
    network_mode: service:tailscale-dozzle
    depends_on:
      tailscale-dozzle:
        condition: service_healthy
    environment:
      - DOZZLE_HOSTNAME=JesseJamesServer
      # Só leitura de logs: sem start/stop/restart nem shell pela interface.
      - DOZZLE_ENABLE_ACTIONS=false
      - DOZZLE_ENABLE_SHELL=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # A imagem do dozzle e scratch (sem shell). O busybox estatico da imagem busybox:musl
      # entra montado so para o healthcheck testar eth0, como nos outros apps.
      - type: image
        source: busybox:musl
        target: /tools
        read_only: true
        image:
          subpath: bin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/tools/busybox", "sh", "-c", "/tools/busybox test -e /sys/class/net/eth0 && /dozzle healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true


x-casaos:
  main: tailscale-dozzle
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: amir20
  category: Utilities
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/dozzle.png
  scheme: http
  port_map: "8888"
  index: /
  title:
    custom: Dozzle
  tagline:
    custom: Logs dos containers atras de Tailscale
  description:
    custom: Dozzle exposto pela sidecar Tailscale, com acesso somente leitura ao Docker.
