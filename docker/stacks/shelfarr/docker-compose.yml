services:
  tailscale-shelfarr:
    image: tailscale/tailscale:latest
    container_name: shelfarr_tailscale
    hostname: shelfarr
    ports:
      # Shelfarr escuta em 80 dentro do container.
      - "5056:80"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/shelfarr:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    networks:
      - media-network

  shelfarr:
    image: ghcr.io/pedro-revez-silva/shelfarr:latest
    container_name: shelfarr
    network_mode: service:tailscale-shelfarr
    depends_on:
      - tailscale-shelfarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SOLID_QUEUE_IN_PUMA=1
    volumes:
      - ${CONFIG_HOST_PATH}/shelfarr/config:/config
      # Shelfarr move arquivo (nao faz hardlink), entao binds separados nao custam nada aqui.
      - ${DATA_HOST_PATH}/downloads:/downloads
      - ${DATA_HOST_PATH}/media/books:/ebooks
      - ${DATA_HOST_PATH}/media/audiobooks:/audiobooks
    restart: unless-stopped

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true


x-casaos:
  main: tailscale-shelfarr
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: Pedro-Revez-Silva
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/shelfarr.png
  scheme: http
  port_map: "5056"
  index: /
  title:
    custom: Shelfarr
  tagline:
    custom: Shelfarr atras de Tailscale
  description:
    custom: Shelfarr exposto pela sidecar Tailscale, na rede Docker compartilhada.
