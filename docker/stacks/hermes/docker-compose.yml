services:
  tailscale-hermes:
    image: tailscale/tailscale:latest
    container_name: hermes_tailscale
    hostname: hermes
    ports:
      - "9119:9119"
      - "8642:8642"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/hermes:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep tailscaled"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - media-network

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    labels:
      - autoheal=true
      - docker-volume-backup.stop-during-backup=true
    network_mode: service:tailscale-hermes
    depends_on:
      tailscale-hermes:
        condition: service_healthy
    command: ["gateway", "run"]
    environment:
      - TZ=${TZ}
      - OPENAI_API_KEY=${HERMES_OPENAI_API_KEY}
      # PAT usado pelo MCP server do GitHub (mcp_servers.github no config.yaml).
      - GITHUB_MCP_PAT=${GITHUB_MCP_PAT}
      # Dashboard web na 9119. Desde a imagem latest (set/2026) o HERMES_DASHBOARD_INSECURE
      # foi removido e o dashboard recusa subir em 0.0.0.0 sem um provedor de auth.
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER:?defina HERMES_DASHBOARD_USER no .env}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:?defina HERMES_DASHBOARD_PASSWORD no .env}
    volumes:
      - ${CONFIG_HOST_PATH}/hermes/data:/opt/data
      # Status do host gerado pelo cron system/cron.d/apt-update (apt-upgradable.txt).
      - /var/lib/host-status:/opt/host:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -e /sys/class/net/eth0 && curl -f http://localhost:9119/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true


x-casaos:
  main: tailscale-hermes
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: Nous Research
  category: Developer
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Hermes/icon.svg
  scheme: http
  port_map: "9119"
  index: /
  title:
    custom: Hermes
  tagline:
    custom: Hermes Agent atras de Tailscale
  description:
    custom: Hermes Agent (gateway + dashboard) exposto pela sidecar Tailscale, na rede Docker compartilhada.
