services:
  tailscale-bazarr:
    image: tailscale/tailscale:latest
    container_name: bazarr_tailscale
    hostname: bazarr
    ports:
      - "6767:6767"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    networks:
      - media-network

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    network_mode: service:tailscale-bazarr
    depends_on:
      - tailscale-bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_HOST_PATH}/bazarr/config:/config
      - ${MEDIA_HOST_PATH}/tv:/tv
      - ${MEDIA_HOST_PATH}/movies:/movies
    restart: unless-stopped

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true

volumes:
  tailscale-state:

x-casaos:
  main: tailscale-bazarr
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: linuxserver.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/bazarr.png
  scheme: http
  port_map: "6767"
  index: /
  title:
    custom: Bazarr
  tagline:
    custom: Bazarr atras de Tailscale
  description:
    custom: Bazarr exposto pela sidecar Tailscale, na rede Docker compartilhada.
