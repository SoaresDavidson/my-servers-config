services:
  tailscale-adguard:
    image: tailscale/tailscale:latest
    container_name: adguard_tailscale
    hostname: adguard
    ports:
      - "3080:80"
      # DNS só no IP da LAN: evita virar resolver aberto em outras interfaces.
      # No tailnet o DNS responde direto no IP do sidecar, sem porta publicada.
      - "${HOST_LAN_IP}:53:53/tcp"
      - "${HOST_LAN_IP}:53:53/udp"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/adguard:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep tailscaled"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - media-network

  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    # Sem o label docker-volume-backup.stop-during-backup: parar o DNS às 03:00 derrubaria a rede.
    network_mode: service:tailscale-adguard
    depends_on:
      tailscale-adguard:
        condition: service_healthy
    volumes:
      - ${CONFIG_HOST_PATH}/adguard/work:/opt/adguardhome/work
      - ${CONFIG_HOST_PATH}/adguard/conf:/opt/adguardhome/conf
    restart: unless-stopped
    healthcheck:
      # Interface web na porta 80, padrão do assistente inicial.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true


x-casaos:
  main: tailscale-adguard
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: AdguardTeam
  category: Network
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/adguard-home.png
  scheme: http
  port_map: "3080"
  index: /
  title:
    custom: AdGuard Home
  tagline:
    custom: DNS com bloqueio de anúncios atras de Tailscale
  description:
    custom: AdGuard Home exposto pela sidecar Tailscale, servindo DNS na LAN e no tailnet.
