services:
  tailscale-profilarr:
    image: tailscale/tailscale:latest
    container_name: profilarr_tailscale
    hostname: profilarr
    ports:
      - "6868:6868"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/profilarr:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    networks:
      - media-network

  profilarr:
    image: santiagosayshey/profilarr:latest
    container_name: profilarr
    labels:
      - docker-volume-backup.stop-during-backup=true
    network_mode: service:tailscale-profilarr
    depends_on:
      - tailscale-profilarr
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_HOST_PATH}/profilarr/config:/config
    restart: unless-stopped

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true


x-casaos:
  main: tailscale-profilarr
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: santiagosayshey
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/profilarr.png
  scheme: http
  port_map: "6868"
  index: /
  title:
    custom: Profilarr
  tagline:
    custom: Profilarr atras de Tailscale
  description:
    custom: Profilarr exposto pela sidecar Tailscale, na rede Docker compartilhada.
