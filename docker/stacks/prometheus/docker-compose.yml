services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: "${PUID:?Defina PUID}:${PGID:?Defina PGID}"
    labels:
      - autoheal=true
      - docker-volume-backup.stop-during-backup=true
    ports:
      # 9090 já é usada pelo dispositivo sem fio do Calibre.
      - "${HOST_LAN_IP:?Defina HOST_LAN_IP para publicar somente na LAN}:9091:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${CONFIG_HOST_PATH:?Defina CONFIG_HOST_PATH}/prometheus:/prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - media-network

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true

x-casaos:
  main: prometheus
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: prometheus
  category: Utilities
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/prometheus.png
  scheme: http
  port_map: "9091"
  index: /
  title:
    custom: Prometheus
  tagline:
    custom: Métricas sem sidecar Tailscale
  description:
    custom: Prometheus com dados persistentes, retenção de 15 dias e WebUI somente na LAN pela porta 9091.
