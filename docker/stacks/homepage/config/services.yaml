# Links abrem pelo Tailscale (https://<app>.<tailnet>). Widgets falam direto
# com o sidecar de cada app na rede Docker compartilhada.
- Mídia:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.{{HOMEPAGE_VAR_TS_DOMAIN}}
        description: Filmes, séries e música
        server: local
        container: jellyfin
    - Jellyseerr:
        icon: jellyseerr.png
        href: https://jellyseerr.{{HOMEPAGE_VAR_TS_DOMAIN}}
        description: Pedidos
        server: local
        container: jellyseerr
        widget:
          type: jellyseerr
          url: http://jellyseerr_tailscale:5055
          key: {{HOMEPAGE_VAR_JELLYSEERR_KEY}}
    - qBittorrent:
        icon: qbittorrent.png
        href: http://{{HOMEPAGE_VAR_HOST_LAN_IP}}:8080
        description: Downloads (Proton VPN, só LAN)
        server: local
        container: qbittorrent

