services:
  tailscale-bookshelf:
    image: tailscale/tailscale:latest
    container_name: bookshelf_tailscale
    hostname: bookshelf
    ports:
      - "8787:8787"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/bookshelf:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    networks:
      - media-network

  bookshelf:
    # Readarr foi descontinuado e as imagens saíram dos registros. Bookshelf e o fork mantido,
    # mesma UI e porta, com metadados do Hardcover.
    image: ghcr.io/pennydreadful/bookshelf:hardcover
    container_name: bookshelf
    network_mode: service:tailscale-bookshelf
    depends_on:
      - tailscale-bookshelf
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_HOST_PATH}/bookshelf/config:/config
      - ${DATA_HOST_PATH}:/data
    restart: unless-stopped

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true


x-casaos:
  main: tailscale-bookshelf
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: pennydreadful
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/readarr.png
  scheme: http
  port_map: "8787"
  index: /
  title:
    custom: Bookshelf
  tagline:
    custom: Bookshelf atras de Tailscale
  description:
    custom: Bookshelf exposto pela sidecar Tailscale, na rede Docker compartilhada.
