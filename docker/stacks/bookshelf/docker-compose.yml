services:
  tailscale-readarr:
    image: tailscale/tailscale:latest
    container_name: readarr_tailscale
    hostname: readarr
    ports:
      - "8787:8787"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/readarr:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    networks:
      - media-network

  readarr:
    # linuxserver nao publica tag latest para o Readarr; develop e a estavel.
    image: lscr.io/linuxserver/readarr:develop
    container_name: readarr
    network_mode: service:tailscale-readarr
    depends_on:
      - tailscale-readarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_HOST_PATH}/readarr/config:/config
      - ${DATA_HOST_PATH}:/data
    restart: unless-stopped

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true


x-casaos:
  main: tailscale-readarr
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: linuxserver.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/readarr.png
  scheme: http
  port_map: "8787"
  index: /
  title:
    custom: Readarr
  tagline:
    custom: Readarr atras de Tailscale
  description:
    custom: Readarr exposto pela sidecar Tailscale, na rede Docker compartilhada.
