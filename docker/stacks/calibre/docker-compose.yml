services:
  tailscale-calibre:
    image: tailscale/tailscale:latest
    container_name: calibre_tailscale
    hostname: calibre
    ports:
      # 8080 no host ja e do qBittorrent; a GUI (KasmVNC) sai em 8082.
      - "8082:8080"
      # Content server, usado pelo Readarr para importar na biblioteca.
      - "8081:8081"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/ts-serve.json
      - TS_USERSPACE=false
    volumes:
      - ${CONFIG_HOST_PATH}/tailscale/calibre:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: always
    networks:
      - media-network

  calibre:
    image: lscr.io/linuxserver/calibre:latest
    container_name: calibre
    network_mode: service:tailscale-calibre
    depends_on:
      - tailscale-calibre
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_HOST_PATH}/calibre/config:/config
      - ${DATA_HOST_PATH}/media:/data/media
    shm_size: "1gb"
    restart: unless-stopped

networks:
  media-network:
    name: ${NETWORK_NAME}
    external: true


x-casaos:
  main: tailscale-calibre
  architectures:
    - amd64
    - arm64
  author: SoaresDavidson
  developer: linuxserver.io
  category: Media
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/calibre.png
  scheme: http
  port_map: "8082"
  index: /
  title:
    custom: Calibre
  tagline:
    custom: Calibre atras de Tailscale
  description:
    custom: Calibre exposto pela sidecar Tailscale, na rede Docker compartilhada.
