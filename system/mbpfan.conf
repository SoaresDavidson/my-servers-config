# Curva antecipada das ventoinhas. O padrão do pacote só acelera acima de 66 °C e só chega ao máximo em
# 86 °C, e a subida dos contêineres levava a CPU a 99 °C antes de elas reagirem. As velocidades mínima e
# máxima continuam vindo do applesmc (fan*_min e fan*_max).
# Instalar:
#   sudo install -m 644 -o root -g root system/mbpfan.conf /etc/mbpfan.conf
#   sudo systemctl restart mbpfan
[general]
low_temp = 50           # abaixo disto, as ventoinhas ficam na velocidade mínima
high_temp = 55          # acima disto, a velocidade sobe aos poucos
max_temp = 80           # acima disto, as ventoinhas ficam no máximo
polling_interval = 1
