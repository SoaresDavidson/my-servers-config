# Desliga o NCQ do SSD interno (APPLE SSD SM1024F, ata1.00). Com a fila em 32, ele cai para ~76 IOPS e
# ~470 ms por leitura sob carga, e os healthchecks expiram; sem NCQ, faz ~667 IOPS e ~22 ms.
# Instalar:
#   sudo install -D -m 644 -o root -g root system/default/grub.d/libata-noncq.cfg /etc/default/grub.d/libata-noncq.cfg
#   sudo update-grub
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT libata.force=1.00:noncq"
