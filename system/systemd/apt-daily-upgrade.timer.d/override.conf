# Move o unattended-upgrades de ~06:00 (padrão) para 04:00, depois do backup das 03:00,
# para o reboot das 04:30 cair na mesma madrugada.
# Instalar:
#   sudo install -D -m 644 -o root -g root system/systemd/apt-daily-upgrade.timer.d/override.conf /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart apt-daily-upgrade.timer
[Timer]
OnCalendar=
OnCalendar=*-*-* 04:00
RandomizedDelaySec=10m
