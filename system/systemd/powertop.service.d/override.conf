# Liga o gerenciamento de energia de USB, SATA, PCIe e áudio no boot (`powertop --auto-tune`, unit do
# pacote powertop) e depois tira do autosuspend o HD de mídia e a rede USB reserva (usb-keep-awake).
# Instalar (depois de instalar system/sbin/usb-keep-awake):
#   sudo install -D -m 644 -o root -g root system/systemd/powertop.service.d/override.conf /etc/systemd/system/powertop.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl enable --now powertop
[Unit]
Description=Ajustes de energia do powertop (exceto HD de mídia e rede USB)

[Service]
ExecStartPost=/usr/local/sbin/usb-keep-awake
