# Sobe o Docker depois do HD de mídia (/mnt/midia, DATA_HOST_PATH) estar montado.
# Wants (e não Requires): se o HD falhar, o resto das stacks (AdGuard etc.) ainda sobe; o
# `chattr +i` no ponto de montagem (ver system/README.md) impede que os containers gravem no SSD.
# Instalar:
#   sudo install -D -m 644 -o root -g root system/systemd/docker.service.d/override.conf /etc/systemd/system/docker.service.d/override.conf
#   sudo systemctl daemon-reload
[Unit]
Wants=mnt-midia.mount
After=mnt-midia.mount

[Service]
Environment=DOCKER_MIN_API_VERSION=1.24
